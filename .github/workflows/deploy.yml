name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set base path
        id: base
        run: |
          REPO_NAME="CongkakPrototype"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "base=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
            echo "dest=." >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO_NAME}/${BRANCH}/" >> "$GITHUB_OUTPUT"
            echo "dest=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npx vite build --base "${{ steps.base.outputs.base }}"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.base.outputs.dest }}
          keep_files: true
